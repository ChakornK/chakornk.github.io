bio: |
  I'm a CS student at UBC who loves turning ideas into real, working products. I build things that solve real problems and have real-world use. I have built an AI-powered debt tracker and planner that won a hackathon prize, a career platform that personalizes students' internship search, and a Chrome extension that blocks social media while you study. 

  I'm currently a Developer at Motion UBC, building a pro-bono platform for a tax clinic, and a Product Developer at Google Developers Student Club UBC. Most of my experience is in web development; I work with TypeScript, Next.js, React, Flutter, and more.

